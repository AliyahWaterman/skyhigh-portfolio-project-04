apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyhigh-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skyhigh-app
  template:
    metadata:
      labels:
        app: skyhigh-app
    spec:
      containers:
        - name: skyhigh-app
          image: aliyahwater/skyhigh-portfolio-04:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: skyhigh-app-service
spec:
  type: NodePort
  selector:
    app: skyhigh-app
  ports:
    - port: 5000
      targetPort: 5000
